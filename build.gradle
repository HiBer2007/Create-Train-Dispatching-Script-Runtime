tasks.named('build') { dependsOn 'graalpySmokeTest' }

// ${file.jarVersion} 读的是 jar manifest 的 Implementation-Version。
// 不显式写入，发布版会显示成 0.0NONE（开发环境已经见过）。
tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title'  : project.findProperty('mod_name') ?: project.archives_name,
            'Implementation-Version': project.version
        )
    }
}

// 把本模组与 GraalPy 运行期依赖复制到 ctdhost 的 run/mods，
// 用于「两个模组同时加载」的集成验证。只挑 org.graalvm，其余是 NeoForge/MC，不能进 mods。
tasks.register('stageModJars') {
    group = 'verification'
    description = '把 ctdscript + GraalPy 依赖放进 ctdhost 的 run/mods'
    doLast {
        def dest = file('../ctdhost/run/mods')
        dest.mkdirs()
        dest.listFiles()?.each { it.delete() }
        copy {
            from tasks.named('jar')
            into dest
        }
        copy {
            from configurations.runtimeClasspath
            include { it.file.name.startsWith('python-community')
                   || it.file.name.startsWith('graal-sdk')
                   || it.file.name.startsWith('polyglot')
                   || it.file.name.startsWith('python-language')
                   || it.file.name.startsWith('python-embedding')
                   || it.file.name.startsWith('nativeimage')
                   || it.file.name.startsWith('truffle-api')
                   || it.file.name.startsWith('truffle-runtime')
                   || it.file.name.startsWith('truffle-compiler')
                   || it.file.name.startsWith('regex')
                   || it.file.name.startsWith('icu4j')
                   || it.file.name.startsWith('collections')
                   || it.file.name.startsWith('native-image')
                   || it.file.name.startsWith('js-community')
                   || it.file.name.startsWith('shadowed-icu4j')
                   || it.file.name.startsWith('profiler') }
            into dest
        }
        println "staged " + (dest.listFiles()?.length ?: 0) + " jars into " + dest
    }
}
tasks.register('printRunCp') {
    doLast {
        def cp = tasks.named('runServer').get().classpath.files
        println "runServer classpath entries: " + cp.size()
        cp.findAll { it.name.contains('polyglot') || it.name.contains('python-language') }.each { println "  FOUND " + it }
        if (cp.findAll { it.name.contains('polyglot') }.isEmpty()) println "  polyglot NOT on runServer classpath"
    }
}

