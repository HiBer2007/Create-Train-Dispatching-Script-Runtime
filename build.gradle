plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

// ── NeoForged maven 镜像 ──────────────────────────────────────────────────
// 与 ctdapi 同一套：maven.neoforged.net 在部分网络下 TCP 不可达。
// ModDevGradle 延迟注册仓库，所以必须挂 whenObjectAdded。
def neoforgeMirror = { repo ->
    if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
        def u = repo.url.toString()
        if (u.contains("://maven.neoforged.net")) {
            repo.url = uri(u.replace("://maven.neoforged.net", "://neoforged.forgecdn.net"))
            logger.lifecycle("[mirror] NeoForged maven -> ${repo.url}")
        }
    }
}
repositories.whenObjectAdded(neoforgeMirror)
repositories.each(neoforgeMirror)
gradle.projectsEvaluated { project.repositories.each(neoforgeMirror) }

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    // 需要一个真实服务端来验证「脚本在游戏里跑得起来」。
    // GraalPy 只在本模组的 runtimeClasspath 上是齐全的，所以从这里起服务最省事。
    mods {
        ctdscript {
            sourceSet sourceSets.main
        }
    }
    runs {
        server {
            server()
            programArgument "--nogui"
        }
    }
}

dependencies {
    // Create 只在**编译期**需要：HUD 要读列车状态（CarriageContraptionEntity / Train）。
    // 不打包、不传递——运行时由玩家装的 Create 提供，与 ctdhost 同一份。
    compileOnly files("../ctdhost/libs/create-1.21.1-6.0.11-312.jar")
    // 当成命名模块，模组模块读不到它 —— 这些副本已剥离 module-info。

    // CTD API：契约层。目前是本地 jar，发布到 maven 后换成坐标。
    implementation files("libs/${project.ctdapi_jar}")

    // ── GraalPy ──────────────────────────────────────────────────────────
    // polyglot 是嵌入 API；python-community 是 Python 语言实现。
    // 两者版本必须一致，否则 Truffle 会在运行时报引擎不匹配。
    implementation "org.graalvm.polyglot:polyglot:${project.graalpy_version}"
    implementation "org.graalvm.polyglot:python-community:${project.graalpy_version}"

    // ── 分发给玩家时用 JarJar ────────────────────────────────────────────
    // 开发环境里 GraalPy 在普通 classpath 上，模组模块读不到（见 docs/12 R2）；
    // 打成嵌套 jar 后 FML 会给它建模块条目，模组才读得到。
    // polyglot 的 module-info 要求一串 GraalVM 兄弟模块（org.graalvm.word 等），
    // 少一个就会在启动时 FindException。这里把整套都嵌进去。
    [["polyglot", "org.graalvm.polyglot"],
     ["word", "org.graalvm.sdk"],
     ["collections", "org.graalvm.sdk"],
     ["nativeimage", "org.graalvm.sdk"],
     ["jniutils", "org.graalvm.sdk"],
     ["truffle-api", "org.graalvm.truffle"],
     ["truffle-runtime", "org.graalvm.truffle"],
     ["truffle-compiler", "org.graalvm.truffle"],
     ["truffle-nfi", "org.graalvm.truffle"],
     ["truffle-nfi-libffi", "org.graalvm.truffle"],
     ["python-language", "org.graalvm.python"],
     ["regex", "org.graalvm.regex"],
     ["icu4j", "org.graalvm.shadowed"],
     ["json", "org.graalvm.shadowed"],
     ["xz", "org.graalvm.shadowed"],
     ["llvm-api", "org.graalvm.llvm"],
     ["profiler-tool", "org.graalvm.tools"]].each { pair ->
        jarJar(implementation(pair[1] + ":" + pair[0] + ":" + project.graalpy_version))
    }

    // python-language 的 module-info 还要求 org.bouncycastle.util。
    // 版本与 GraalPy 不同线，单独指定。
    ["bcprov-jdk18on", "bcpkix-jdk18on", "bcutil-jdk18on"].each { n ->
        jarJar(implementation("org.bouncycastle:" + n + ":" + project.bouncycastle_version))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// ── 烟测：验证 GraalPy 能在这个 JVM 上真的跑起来 ──────────────────────────
tasks.register('graalpySmokeTest', JavaExec) {
    group = 'verification'
    description = '不启动游戏，直接验证 GraalPy 能否创建 python 上下文并执行代码'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'top.hibermod.ctdscript.tools.GraalPySmokeTest'
    jvmArgs = ['--enable-native-access=ALL-UNNAMED']
    systemProperty 'polyglot.engine.WarnInterpreterOnly', 'false'
}

